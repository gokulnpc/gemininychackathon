# Story Factory — local Docker Compose
#
# Prerequisites:
#   1. Copy backend/.env.example → backend/.env and fill in your GEMINI_API_KEY
#      and GCP credentials (see comments below for options).
#   2. docker compose up --build
#
# Services:
#   voicevid-frontend        http://localhost:3000
#   voicevid-api             http://localhost:8000  (docs: /docs)
#   timeline-render-worker   internal only (used by api for renderer exports)

networks:
  voicevid:
    driver: bridge

services:

  # ── Twick timeline renderer ──────────────────────────────────────────────────
  # Node.js service that renders timeline JSON → MP4 via headless Chromium.
  # Not exposed to the host — only the API needs it.
  timeline-render-worker:
    build:
      context: ./timeline-render-worker
      dockerfile: Dockerfile
    image: voicevid-renderer:latest
    container_name: timeline-render-worker
    restart: unless-stopped
    expose:
      - "4001"
    networks:
      - voicevid
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  voicevid-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: voicevid-api:latest
    container_name: voicevid-api
    restart: unless-stopped
    ports:
      - "8000:8080"
    env_file:
      - ./backend/.env          # GEMINI_API_KEY, GCS_BUCKET, GCP creds, etc.
    environment:
      # Internal renderer URL (Docker network — not exposed to host)
      TIMELINE_RENDER_WORKER_URL: http://timeline-render-worker:4001
      # Leave empty → pipeline runs synchronously in-process (no Cloud Tasks needed)
      WORKER_URL: ""
      # Used to normalize media src in timeline JSON for server-side rendering
      FRONTEND_PUBLIC_BASE_URL: http://localhost:3000
      API_PUBLIC_BASE_URL: http://localhost:8000
    volumes:
      - ./backend/assets:/app/assets:ro   # music presets + art-style references
      # ── GCP Application Default Credentials ────────────────────────────────
      # Option A (recommended): mount gcloud CLI ADC if you have gcloud installed.
      #   Run first: gcloud auth application-default login
      #   Then uncomment the line below:
      # - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
      #
      # Option B: service account key file
      #   Set GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json in backend/.env
      #   and uncomment:
      # - ./credentials.json:/app/credentials.json:ro
    tmpfs:
      - /tmp/voicevid_work     # pipeline scratch space — cleared on restart
    networks:
      - voicevid
    depends_on:
      timeline-render-worker:
        condition: service_healthy
    healthcheck:
      # Check the container port (8080), not the host port (8000)
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  voicevid-frontend:
    build:
      context: ./frontend-sky
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # API URL points to the host port — the browser calls this directly.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        # Firebase config — these are public browser-side keys (safe to hardcode).
        # Override via .env at the repo root if you use your own Firebase project.
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-AIzaSyAPw6KJjyDr8CPZXkeJbaRQsFkcUO-Hd38}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-story-labs-factory.firebaseapp.com}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-story-labs-factory}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-story-labs-factory.firebasestorage.app}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-804196292057}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:804196292057:web:947aeee83ff1293466b5c8}
    image: voicevid-frontend:latest
    container_name: voicevid-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - voicevid
    depends_on:
      voicevid-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
