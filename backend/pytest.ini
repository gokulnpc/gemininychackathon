[pytest]
# ---------------------------------------------------------------------------
# Story Factory — pytest configuration
# ---------------------------------------------------------------------------

# Only collect from the pytest/ subdirectory.
# Existing custom-runner tests in tests/unit/ and tests/integration/ are NOT
# collected by pytest — they continue to run as standalone Python scripts.
# This prevents import errors and asyncio conflicts with the old test runner.
testpaths = tests/pytest

# Minimum version guard
minversion = 7.0

# ---------------------------------------------------------------------------
# pytest-asyncio: auto mode
# Every "async def test_*" function is automatically treated as an asyncio
# coroutine. No @pytest.mark.asyncio decorator needed on any test.
# ---------------------------------------------------------------------------
asyncio_mode = auto

# ---------------------------------------------------------------------------
# Markers
# Define all custom markers here to avoid PytestUnknownMarkWarning.
# ---------------------------------------------------------------------------
markers =
    unit: Pure unit tests — fully mocked, no external calls, runs in <1s
    integration: Integration tests — require GCP credentials and env vars
    slow: Tests that are inherently slow (>5s) — skip with: pytest -m "not slow"
    api: Tests that call live external APIs (Gemini, GCS, Firestore, SendGrid)

# ---------------------------------------------------------------------------
# Default options applied to every pytest run
# ---------------------------------------------------------------------------
addopts =
    --tb=short
    --strict-markers
    -q

# Run with coverage:
#   cd backend && pytest --cov=services --cov-report=term-missing --cov-report=html:htmlcov
#
# Run only unit tests (fast):
#   cd backend && pytest -m unit
#
# Run a specific service test:
#   cd backend && pytest tests/pytest/unit/test_tts.py -v

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_cli = false
log_level = WARNING
