steps:
  # Build the Docker image (shared by both API and Worker services)
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_IMAGE
      - ./backend

  # Push to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_IMAGE

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/voicevid/voicevid/api:latest

images:
  - $_IMAGE

options:
  logging: CLOUD_LOGGING_ONLY
